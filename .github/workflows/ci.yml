name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# A new push to the same branch cancels the run that is already in flight.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, Lint and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: smart_inventory
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      # `verify` runs checkstyle (validate), the tests, and the JaCoCo 80% line
      # coverage gate, so a single command covers lint, test and coverage.
      - name: Build and verify with Maven
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: smart_inventory
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          JWT_SECRET: dev-jwt-token-secret-must-be-very-long-for-hs256-signature-algorithm-validation
          JWT_EXPIRATION_MS: 86400000

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload application jar
        uses: actions/upload-artifact@v7
        with:
          name: application-jar
          path: target/*.jar
          retention-days: 7

  docker:
    name: Docker Image Builds
    runs-on: ubuntu-latest
    # Proves the Dockerfile still builds before a change reaches main, where the
    # CD workflow publishes from the same file. Nothing is pushed here.
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
