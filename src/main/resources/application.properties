spring.application.name=smart-inventory-management-system

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:smart_inventory}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

logging.level.root=INFO
logging.level.com.example.smartinventory=DEBUG
logging.level.org.springframework=INFO
logging.level.org.hibernate=INFO

jwt.secret=${JWT_SECRET:change-this-super-secret-key-min-256-bits-long-for-hs256}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===== Stock Event Notifications =====
# Webhook channel is opt-in. Set enabled=true and a url to POST stock events as JSON.
notifications.webhook.enabled=${NOTIFICATIONS_WEBHOOK_ENABLED:false}
notifications.webhook.url=${NOTIFICATIONS_WEBHOOK_URL:}

# Email channel is opt-in. Set enabled=true plus from/to and SMTP settings below.
notifications.email.enabled=${NOTIFICATIONS_EMAIL_ENABLED:false}
notifications.email.from=${NOTIFICATIONS_EMAIL_FROM:}
notifications.email.to=${NOTIFICATIONS_EMAIL_TO:}

# SMTP transport (used only when the email channel is enabled).
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:25}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}

# ===== OpenAPI / Swagger UI =====
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.api-docs.path=/v3/api-docs
